<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>NasCabOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6bff'/%3E%3Cpath d='M8 11h16M8 16h16M8 21h10' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="console.css">
</head>
<body>

<!-- ============ 登录 / 初始化 ============ -->
<div id="auth-view" class="auth">
  <div class="auth__bg" aria-hidden="true">
    <span class="auth__glow auth__glow--a"></span>
    <span class="auth__glow auth__glow--b"></span>
    <span class="auth__grid"></span>
  </div>

  <div class="auth__card">
    <div class="auth__brand">
      <span class="logo logo--lg" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="url(#lg)"/><path d="M8 11h16M8 16h16M8 21h10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs></svg>
      </span>
      <div class="auth__titles">
        <h1 id="auth-title">NasCabOS</h1>
        <p id="auth-subtitle">私有云存储 · 服务端控制台</p>
      </div>
    </div>

    <!-- 登录表单 -->
    <form id="login-form" class="auth__form" autocomplete="on" novalidate>
      <label class="field">
        <span class="field__label">用户名</span>
        <span class="field__box">
          <svg class="field__icon" viewBox="0 0 20 20"><path d="M10 10a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM3.5 17c0-3 2.9-5 6.5-5s6.5 2 6.5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="login-username" name="username" type="text" placeholder="请输入用户名" autocomplete="username" required>
        </span>
      </label>

      <label class="field">
        <span class="field__label">密码</span>
        <span class="field__box">
          <svg class="field__icon" viewBox="0 0 20 20"><path d="M5.5 8.5V6.5a4.5 4.5 0 019 0v2M4 8.5h12v8H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="login-password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
          <button type="button" class="field__eye" id="toggle-pwd" title="显示/隐藏密码" aria-label="显示或隐藏密码">
            <svg viewBox="0 0 20 20"><path d="M10 5c-4 0-6.5 3-7.2 5 .7 2 3.2 5 7.2 5s6.5-3 7.2-5C16.5 8 14 5 10 5z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
        </span>
      </label>

      <p class="auth__error" id="login-error" hidden></p>

      <button type="submit" class="btn btn--primary btn--block" id="login-btn">登 录</button>
    </form>

    <!-- 两步验证 -->
    <form id="twofa-form" class="auth__form" hidden novalidate>
      <p class="auth__hint">该账号已开启两步验证，请输入身份验证器上的 6 位动态码。</p>
      <label class="field">
        <span class="field__label">动态码</span>
        <span class="field__box">
          <svg class="field__icon" viewBox="0 0 20 20"><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M5.3 5.3l1.4 1.4M13.3 13.3l1.4 1.4M14.7 5.3l-1.4 1.4M6.7 13.3l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          <input id="twofa-code" type="text" inputmode="numeric" maxlength="8" placeholder="000000" autocomplete="one-time-code" required>
        </span>
      </label>
      <p class="auth__error" id="twofa-error" hidden></p>
      <button type="submit" class="btn btn--primary btn--block" id="twofa-btn">验 证</button>
      <button type="button" class="btn btn--ghost btn--block" id="twofa-back">返回登录</button>
    </form>

    <!-- 首次部署初始化 -->
    <form id="setup-form" class="auth__form" hidden novalidate>
      <div class="auth__steps">
        <span class="auth__step is-active">1 创建管理员</span>
        <span class="auth__step">2 完成</span>
      </div>
      <p class="auth__hint">检测到服务器尚未初始化，请创建第一个超级管理员账号。</p>
      <label class="field">
        <span class="field__label">用户名 <em>3-20 位字母、数字或下划线</em></span>
        <span class="field__box">
          <svg class="field__icon" viewBox="0 0 20 20"><path d="M10 10a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM3.5 17c0-3 2.9-5 6.5-5s6.5 2 6.5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="setup-username" type="text" placeholder="例如 admin" autocomplete="off" required>
        </span>
      </label>
      <div class="auth__row">
        <label class="field">
          <span class="field__label">密码 <em>至少 6 位</em></span>
          <span class="field__box">
            <input id="setup-password" type="password" placeholder="设置密码" autocomplete="new-password" required>
          </span>
        </label>
        <label class="field">
          <span class="field__label">确认密码</span>
          <span class="field__box">
            <input id="setup-password2" type="password" placeholder="再输一次" autocomplete="new-password" required>
          </span>
        </label>
      </div>
      <p class="auth__error" id="setup-error" hidden></p>
      <button type="submit" class="btn btn--primary btn--block" id="setup-btn">创建并进入控制台</button>
    </form>

    <!-- 初始化完成 -->
    <div id="setup-done" class="auth__form" hidden>
      <div class="auth__done">
        <span class="auth__done-icon">
          <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <h2>初始化完成</h2>
        <p>超级管理员已创建，正在进入控制台…</p>
      </div>
    </div>

    <footer class="auth__foot">
      <span id="auth-version">—</span>
      <span class="auth__dot">·</span>
      <span>建议通过 HTTPS 或反向代理访问</span>
    </footer>
  </div>
</div>

<!-- ============ 控制台 ============ -->
<div id="app-view" class="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="url(#sg)"/><path d="M8 11h16M8 16h16M8 21h10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs></svg>
      </span>
      <span class="sidebar__name" id="brand-name">NasCabOS</span>
    </div>

    <nav class="sidebar__nav" id="nav"></nav>

    <div class="sidebar__foot">
      <div class="sidebar__status" id="sidebar-status">
        <span class="dot dot--ok"></span><span>服务运行中</span>
      </div>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <button class="topbar__burger" id="burger" aria-label="打开菜单">
        <svg viewBox="0 0 20 20"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>

      <div class="topbar__search">
        <svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="global-search" type="search" placeholder="搜索功能菜单…" autocomplete="off">
        <kbd>/</kbd>
      </div>

      <div class="topbar__right">
        <button class="iconbtn" id="btn-notice" title="系统通知" aria-label="系统通知">
          <svg viewBox="0 0 20 20"><path d="M10 3a4 4 0 014 4v3l1.4 2.4H4.6L6 10V7a4 4 0 014-4zM8.4 15a1.8 1.8 0 003.2 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span class="iconbtn__badge" id="notice-badge" hidden></span>
        </button>

        <div class="userbox" id="userbox">
          <button class="userbox__btn" id="userbox-btn">
            <span class="avatar" id="user-avatar">A</span>
            <span class="userbox__meta">
              <strong id="user-name">—</strong>
              <em id="user-role">—</em>
            </span>
            <svg class="userbox__caret" viewBox="0 0 20 20"><path d="M6 8l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <div class="userbox__menu" id="userbox-menu" hidden>
            <div class="userbox__head">
              <strong id="menu-username">—</strong>
              <span id="menu-role">—</span>
            </div>
            <button data-act="refresh"><svg viewBox="0 0 20 20"><path d="M15 10a5 5 0 11-1.6-3.7M15 3.5V7h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>刷新数据</button>
            <button data-act="about"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 9v4M10 6.6v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>关于本机</button>
            <button data-act="logout" class="is-danger"><svg viewBox="0 0 20 20"><path d="M8 6H5v8h3M11 8l3 2-3 2M12 10H7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>退出登录</button>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<div id="toast-root" class="toast-root"></div>
<div class="scrim" id="scrim" hidden></div>

<script src="console.js"></script>
</body>
</html>
